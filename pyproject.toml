[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dandelion"
version = "0.1.0"
description = "A CLI-style Agent tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core LLM Providers
    "anthropic>=0.25.0,<1.0.0",
    "google-genai>=2.14.0,<3.0.0",
    "openai>=2.0.0,<3.0.0",
    # Utilities
    "python-dotenv>=1.0.0,<2.0.0",
    "pyyaml>=6.0,<7.0",
    "prompt-toolkit>=3.0.0,<4.0.0",
    "requests>=2.31.0,<3.0.0",
    # Excel/Table Processing
    "pandas>=2.0.0,<4.0.0",
    "openpyxl>=3.0.0,<4.0.0",
    "tabulate>=0.9.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "nuitka",
    "zstandard",
    "ordered-set",
    "pytest",
    "tzdata",
]
